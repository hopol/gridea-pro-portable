# =============================================================================
# Gridea Pro Portable — 绿色便携版自动构建
# =============================================================================
# 触发方式：
#   1. 推送 v 开头的 tag → 拉取源项目对应 tag，构建绿色便携版 + 创建 GitHub Release
#   2. 定时触发（cron）→ 拉取源项目 main 分支，仅测试构建
#   3. 手动触发（workflow_dispatch）→ 可指定 tag 或 main，仅测试构建
#
# 发布策略：每个平台编译完成后立即发布到 Release，无需等待其他平台。
#
# 构建产物命名（统一前缀 gridea-pro-portable）：
#   Linux   → gridea-pro-portable-linux-amd64.tar.gz
#   macOS   → gridea-pro-portable-macos-{arm64,amd64}.zip
#   Windows → gridea-pro-portable-windows-{amd64,arm64}.zip
# =============================================================================

name: Portable Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "源项目 ref（tag 如 v1.0.0，或 main）"
        required: true
        default: "main"
        type: string

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  PYTHONIOENCODING: "utf-8"
  APP_NAME: "Gridea Pro"
  BIN_NAME: "Gridea Pro"
  BIN_SLUG: "gridea-pro"
  RELEASE_PREFIX: "gridea-pro-portable"
  UPSTREAM_REPO: "Gridea-Pro/gridea-pro"
  UPSTREAM_URL: "https://github.com/Gridea-Pro/gridea-pro.git"

permissions:
  contents: write

jobs:
  # ===========================================================================
  # 统一提取版本号 & 确定上游 ref
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.VERSION }}
      upstream_ref: ${{ steps.meta.outputs.UPSTREAM_REF }}
      release_tag: ${{ steps.meta.outputs.RELEASE_TAG }}
      is_prerelease: ${{ steps.meta.outputs.IS_PRERELEASE }}
    steps:
      - name: Determine version and upstream ref
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            echo "VERSION=${VER}" >> $GITHUB_OUTPUT
            echo "UPSTREAM_REF=${VER}" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=${VER}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="${{ inputs.upstream_ref }}"
            echo "VERSION=${REF}" >> $GITHUB_OUTPUT
            echo "UPSTREAM_REF=${REF}" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=portable-${REF}" >> $GITHUB_OUTPUT
          else
            NIGHTLY="nightly-$(date +%Y%m%d)"
            echo "VERSION=${NIGHTLY}" >> $GITHUB_OUTPUT
            echo "UPSTREAM_REF=main" >> $GITHUB_OUTPUT
            echo "RELEASE_TAG=${NIGHTLY}" >> $GITHUB_OUTPUT
          fi
          # 预发布检测
          TAG="${GITHUB_OUTPUT}"
          if echo "${VER:-${REF:-${NIGHTLY:-}}}" | grep -qiE '(beta|alpha|rc|nightly|dev)'; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # macOS — arm64 + amd64
  # ===========================================================================
  build-macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: arm64
            platform: darwin/arm64
          - arch: amd64
            platform: darwin/amd64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch "${UPSTREAM_REF}" \
            "${UPSTREAM_URL}" source 2>/dev/null || \
          git clone --depth 1 "${UPSTREAM_URL}" source

      - name: Apply portable mode patch
        run: python scripts/apply_portable_patch.py source

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: wails-cli-${{ runner.os }}-v2.12

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Patch wails.json productVersion
        run: |
          cd source
          VER="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            j.info = j.info || {};
            j.info.productVersion = '${VER}';
            fs.writeFileSync('wails.json', JSON.stringify(j, null, 4) + '\n');
            console.log('productVersion -> ${VER}');
          "

      - name: Install frontend dependencies
        run: |
          cd source/frontend
          npm install --legacy-peer-deps

      - name: Build portable macOS ${{ matrix.arch }}
        env:
          CGO_ENABLED: 1
        run: |
          cd source
          LDFLAGS="-X main.Version=${VERSION#v}"
          if [[ -n "${{ secrets.GH_OAUTH_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.githubClientID=${{ secrets.GH_OAUTH_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}"
          fi
          if [[ -n "${{ secrets.NETLIFY_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.netlifyClientID=${{ secrets.NETLIFY_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.netlifyClientSecret=${{ secrets.NETLIFY_CLIENT_SECRET }}"
          fi
          if [[ -n "${{ secrets.VERCEL_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.vercelClientID=${{ secrets.VERCEL_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.vercelClientSecret=${{ secrets.VERCEL_CLIENT_SECRET }}"
          fi
          wails build -platform ${{ matrix.platform }} -clean -trimpath \
            -tags portable -ldflags "${LDFLAGS}"

      - name: Build MCP server
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          cd source
          go build -tags portable \
            -ldflags="-s -w -X main.Version=${{ env.VERSION }}" \
            -o "build/bin/${{ env.BIN_NAME }}.app/Contents/MacOS/${{ env.BIN_SLUG }}-mcp" \
            ./backend/cmd/mcp

      - name: Package portable zip
        run: |
          cd source/build/bin
          touch "${{ env.BIN_NAME }}.app/Contents/MacOS/.portable"
          OUTPUT="../../../${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ env.BIN_NAME }}.app" "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Generate SHA256 and publish release
        run: |
          FILE="${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "$FILE" > "${FILE}.sha256"
          cat "${FILE}.sha256"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Gridea Pro Portable ${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          body: |
            ## Gridea Pro Portable ${{ env.VERSION }}

            基于 [Gridea Pro](https://github.com/Gridea-Pro/gridea-pro) 源码构建的绿色便携版。

            - 不污染系统：不写入注册表、不修改系统文件
            - 解压即用：所有数据在程序同级目录
            - 便携迁移：整目录拷贝即可
          files: |
            ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip
            ${{ env.RELEASE_PREFIX }}-macos-${{ matrix.arch }}.zip.sha256
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Windows — amd64 + arm64
  # ===========================================================================
  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      # A failure in one architecture must not cancel the other build. This is
      # especially important because Wails CLI installation can still be
      # downloading while its sibling job reaches a later build step.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone upstream source
        shell: bash
        run: |
          git clone --depth 1 --branch "${UPSTREAM_REF}" \
            "${UPSTREAM_URL}" source 2>/dev/null || \
          git clone --depth 1 "${UPSTREAM_URL}" source

      - name: Apply portable mode patch
        shell: bash
        run: python scripts/apply_portable_patch.py source

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-cli-${{ runner.os }}-v2.12

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Patch wails.json productVersion
        shell: bash
        run: |
          cd source
          VER="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            j.info = j.info || {};
            j.info.productVersion = '${VER}';
            fs.writeFileSync('wails.json', JSON.stringify(j, null, 4) + '\n');
            console.log('productVersion -> ${VER}');
          "

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd source/frontend
          npm install --legacy-peer-deps

      - name: Set up Windows CGO compiler
        shell: pwsh
        run: |
          # github.com/chai2010/webp requires CGO. GitHub-hosted Windows runners
          # do not provide a suitable MinGW compiler for every target arch by
          # default, so use llvm-mingw for both amd64 and arm64 builds.
          # 20250103 was never published as an llvm-mingw release asset and
          # therefore returns HTTP 404. Keep this valid release pinned so the
          # toolchain used for release builds is reproducible.
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-msvcrt-x86_64.zip"
          $zipPath = "$env:TEMP\llvm-mingw.zip"
          $extractRoot = "C:\llvm-mingw"
          Write-Host "Downloading llvm-mingw for Windows CGO builds..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force
          $binDir = Get-ChildItem -Path $extractRoot -Directory |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "bin" }
          if (-not (Test-Path $binDir)) {
            throw "llvm-mingw bin directory not found under $extractRoot"
          }
          if ("${{ matrix.arch }}" -eq "arm64") {
            $cc = "aarch64-w64-mingw32-gcc"
            $cxx = "aarch64-w64-mingw32-g++"
          } else {
            $cc = "x86_64-w64-mingw32-gcc"
            $cxx = "x86_64-w64-mingw32-g++"
          }
          Write-Host "Adding $binDir to PATH and setting CC=$cc CXX=$cxx..."
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$cc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$cxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CGO_ENABLED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $binDir "$cc.exe") --version

      - name: Build portable Windows ${{ matrix.arch }}
        env:
          CGO_ENABLED: 1
        shell: bash
        run: |
          cd source
          LDFLAGS="-X main.Version=${VERSION#v}"
          if [[ -n "${{ secrets.GH_OAUTH_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.githubClientID=${{ secrets.GH_OAUTH_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}"
          fi
          if [[ -n "${{ secrets.NETLIFY_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.netlifyClientID=${{ secrets.NETLIFY_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.netlifyClientSecret=${{ secrets.NETLIFY_CLIENT_SECRET }}"
          fi
          if [[ -n "${{ secrets.VERCEL_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.vercelClientID=${{ secrets.VERCEL_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.vercelClientSecret=${{ secrets.VERCEL_CLIENT_SECRET }}"
          fi
          wails build -platform windows/${{ matrix.arch }} -clean -trimpath \
            -tags portable -ldflags "${LDFLAGS}"

      - name: Build MCP server
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          cd source
          go build -tags portable -ldflags="-s -w -X main.Version=${{ env.VERSION }}" -o "build/bin/${{ env.BIN_SLUG }}-mcp.exe" ./backend/cmd/mcp

      - name: Package portable zip
        shell: pwsh
        run: |
          $zipName = "${{ env.RELEASE_PREFIX }}-windows-${{ matrix.arch }}.zip"
          $stagingDir = "portable-staging"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item "source\build\bin\${{ env.BIN_NAME }}.exe" "$stagingDir\"
          if (Test-Path "source\build\bin\${{ env.BIN_SLUG }}-mcp.exe") {
            Copy-Item "source\build\bin\${{ env.BIN_SLUG }}-mcp.exe" "$stagingDir\"
          }
          New-Item -ItemType File -Force -Path "$stagingDir\.portable" | Out-Null
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $zipName -Force
          Get-ChildItem $zipName | Select-Object Name, Length

      - name: Generate SHA256 and publish release
        shell: pwsh
        run: |
          $file = "${{ env.RELEASE_PREFIX }}-windows-${{ matrix.arch }}.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -FilePath "$file.sha256" -Encoding ASCII -NoNewline
          Get-Content "$file.sha256"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Gridea Pro Portable ${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          body: |
            ## Gridea Pro Portable ${{ env.VERSION }}

            基于 [Gridea Pro](https://github.com/Gridea-Pro/gridea-pro) 源码构建的绿色便携版。

            - 不污染系统：不写入注册表、不修改系统文件
            - 解压即用：所有数据在程序同级目录
            - 便携迁移：整目录拷贝即可
          files: |
            ${{ env.RELEASE_PREFIX }}-windows-${{ matrix.arch }}.zip
            ${{ env.RELEASE_PREFIX }}-windows-${{ matrix.arch }}.zip.sha256
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Linux — amd64
  # ===========================================================================
  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch "${UPSTREAM_REF}" \
            "${UPSTREAM_URL}" source 2>/dev/null || \
          git clone --depth 1 "${UPSTREAM_URL}" source

      - name: Apply portable mode patch
        run: python3 scripts/apply_portable_patch.py source

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: wails-cli-${{ runner.os }}-v2.12

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Patch wails.json productVersion
        run: |
          cd source
          VER="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
            j.info = j.info || {};
            j.info.productVersion = '${VER}';
            fs.writeFileSync('wails.json', JSON.stringify(j, null, 4) + '\n');
            console.log('productVersion -> ${VER}');
          "

      - name: Install frontend dependencies
        run: |
          cd source/frontend
          npm install --legacy-peer-deps

      - name: Build portable Linux ${{ matrix.arch }}
        env:
          CGO_ENABLED: 1
        run: |
          cd source
          LDFLAGS="-X main.Version=${VERSION#v}"
          if [[ -n "${{ secrets.GH_OAUTH_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.githubClientID=${{ secrets.GH_OAUTH_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.githubClientSecret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}"
          fi
          if [[ -n "${{ secrets.NETLIFY_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.netlifyClientID=${{ secrets.NETLIFY_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.netlifyClientSecret=${{ secrets.NETLIFY_CLIENT_SECRET }}"
          fi
          if [[ -n "${{ secrets.VERCEL_CLIENT_ID }}" ]]; then
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.vercelClientID=${{ secrets.VERCEL_CLIENT_ID }}"
            LDFLAGS="${LDFLAGS} -X gridea-pro/backend/internal/service/oauth.vercelClientSecret=${{ secrets.VERCEL_CLIENT_SECRET }}"
          fi
          wails build -platform linux/${{ matrix.arch }} -clean -trimpath \
            -tags "portable webkit2_41" -ldflags "${LDFLAGS}"

      - name: Build MCP server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          cd source
          go build -tags portable \
            -ldflags="-s -w -X main.Version=${{ env.VERSION }}" \
            -o "build/bin/${{ env.BIN_SLUG }}-mcp" \
            ./backend/cmd/mcp

      - name: Package portable tar.gz
        run: |
          STAGING="portable-staging"
          mkdir -p "${STAGING}"
          cp "source/build/bin/${{ env.BIN_NAME }}" "${STAGING}/gridea-pro"
          chmod 755 "${STAGING}/gridea-pro"
          if [[ -f "source/build/bin/${{ env.BIN_SLUG }}-mcp" ]]; then
            cp "source/build/bin/${{ env.BIN_SLUG }}-mcp" "${STAGING}/"
            chmod 755 "${STAGING}/${{ env.BIN_SLUG }}-mcp"
          fi
          touch "${STAGING}/.portable"
          cat > "${STAGING}/gridea-pro.sh" << 'LAUNCHER'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export GRIDEA_PRO_PORTABLE=1
          export GRIDEA_PRO_DATA_DIR="${SCRIPT_DIR}/gridea-pro-data"
          mkdir -p "${GRIDEA_PRO_DATA_DIR}"
          exec "${SCRIPT_DIR}/gridea-pro" "$@"
          LAUNCHER
          chmod 755 "${STAGING}/gridea-pro.sh"
          OUTPUT="${{ env.RELEASE_PREFIX }}-linux-${{ matrix.arch }}.tar.gz"
          tar czf "${OUTPUT}" -C "${STAGING}" .
          ls -lh "${OUTPUT}"

      - name: Generate SHA256 and publish release
        run: |
          FILE="${{ env.RELEASE_PREFIX }}-linux-${{ matrix.arch }}.tar.gz"
          sha256sum "$FILE" > "${FILE}.sha256"
          cat "${FILE}.sha256"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Gridea Pro Portable ${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          body: |
            ## Gridea Pro Portable ${{ env.VERSION }}

            基于 [Gridea Pro](https://github.com/Gridea-Pro/gridea-pro) 源码构建的绿色便携版。

            - 不污染系统：不写入注册表、不修改系统文件
            - 解压即用：所有数据在程序同级目录
            - 便携迁移：整目录拷贝即可
          files: |
            ${{ env.RELEASE_PREFIX }}-linux-${{ matrix.arch }}.tar.gz
            ${{ env.RELEASE_PREFIX }}-linux-${{ matrix.arch }}.tar.gz.sha256
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
